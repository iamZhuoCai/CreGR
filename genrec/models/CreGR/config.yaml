# Overwritting configs
metadata: sentence
lr: 0.01             # Overwrite learning rate
weight_decay: 0.05    # Overwrite weight decay

tokenizer_name: MultiHeadVQVAE

max_item_seq_len: 4

dropout_rate: 0.1
activation_type: silu
bias_for_layer_norm: False
block_type: llama
d_model: 256
mlp_ratio: 4
init_fn: mitchell
layer_norm_type: rms
n_heads: 4
n_kv_heads: 4
n_layers: 4
rope: False
rope_theta: 500000.0
weight_tying: False

his_mask_w: 1

gen_steps: 4
val_num_beams: 1
num_beams: 50
temperature: 1.0

# Last-token credibility loss weights (see CreGR._build_last_token_mask_weight):
# - none: disable credibility masking on the label last token (uniform weight 1).
# - known_uncredible_only: apply known_uncredible_mask_mode to known-uncredible samples.
# - known_uncredible_and_unknown: same, plus sigmoid reweighting for unknown label items.
last_token_cred_mask: known_uncredible_only

# Behavior for known-uncredible samples when last_token_cred_mask includes them:
# - hard: original behavior, set last-token mask weight to 0.
# - soft: set last-token mask weight to sigmoid(sim_to_cred - sim_to_uncred), i.e. downweight (<1).
known_uncredible_mask_mode: hard